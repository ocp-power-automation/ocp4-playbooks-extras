---

- name: Invoke the role check-cluster-health to check cluster status
  include_role:
    name: check-cluster-health

- name: Deploy COO stack
  block:
    - name: Create a target namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ coo_e2e_namespace }}"

    - name: Create MonitoringStack
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: monitoring.rhobs/v1alpha1
          kind: MonitoringStack
          metadata:
            labels:
              mso: example
            name: multi-ns
            namespace: "{{ coo_e2e_namespace }}"
          spec:
            alertmanagerConfig:
              disabled: false
            logLevel: info
            namespaceSelector:
              matchLabels:
                monitoring.rhobs/stack: multi-ns
            prometheusConfig:
              replicas: 2
            resourceSelector:
               matchLabels:
                app: demo
                monitoring.rhobs/stack: multi-ns
            resources: {}
            retention: 120h

    - name: Create ThanosQuerier
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: monitoring.rhobs/v1alpha1
          kind: ThanosQuerier
          metadata:
            name: example-thanos
            namespace: "{{ coo_e2e_namespace }}"
          spec:
            namespaceSelector:
              matchNames:
                - "{{ coo_e2e_namespace }}"
            selector:
              matchLabels:
                mso: example

    - name: Verify ThanosQuerier and MonitoringStack pods are running
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ coo_e2e_namespace }}"
      register: mon_pods_info
      until: mon_pods_info.resources | selectattr('status.phase','equalto','Running') | list | length >= 5
      retries: 10
      delay: 30

  when: enable_coo_stack

- name: Deploy logging UIPlugin
  block:
    - name: Deploy cluster logging operator and loki operator and lokistack
      include_role:
        name: ocp-cluster-logging
      vars:
        ocp_cluster_logging: true
        cluster_log_forwarder: true
        clf_clean_up: false
        cluster_logging_channel: "{{ coo_cluster_logging_channel}}"
        loki_channel: "{{ coo_loki_channel }}"

    - name: Get lokistack name
      k8s_info:
        api_version: loki.grafana.com/v1
        kind: LokiStack
        namespace: openshift-logging
      register: lokistack_name

    - name: Enable UIPlugin
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: observability.openshift.io/v1alpha1
          kind: UIPlugin
          metadata:
            name: logging
          spec:
            logging:
              logsLimit: 6
              lokiStack:
                name: "{{ lokistack_name.resources[0].metadata.name }}"
              timeout: 6m
            type: Logging

    - name: Verify logging UIPlugin
      shell: oc get pods -n "{{ coo_operator_namespace }}" --no-headers | grep logging | grep "Running\|Completed" | wc -l
      register: logging_pods
      until: logging_pods.stdout|int == 1 and logging_pods.stderr == ""
      retries: 10
      delay: 30
  when: enable_logging_uiplugin

- name: Check and install tempo and opentelemetry operators  
  block:
    - name: Check if Tempo Operator exists 
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: openshift-tempo-operator
      register: tempo_csv
    
    - name: Check if OpenTelemetry Operator exists
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: openshift-opentelemetry-operator
      register: opentelemetry_csv

    - name: Install tempo operator
      block:
        - name: Create a target namespace for tempo operator
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: "{{ tempo_operator_namespace }}"
                labels:
                  openshift.io/cluster-monitoring: "true"
        
        - name: Create a OperatorGroup for tempo operator
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: operators.coreos.com/v1
              kind: OperatorGroup
              metadata:
                name: "{{ tempo_operator_namespace }}"
                namespace: "{{ tempo_operator_namespace }}"

        - name: Create a subscription for tempo operator
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: operators.coreos.com/v1alpha1
              kind: Subscription
              metadata:
                name: "tempo-product"
                namespace: "{{ tempo_operator_namespace }}"
              spec:
                channel: "{{ coo_channel }}"
                installPlanApproval: Automatic
                name: "tempo-product"
                source: "redhat-operators"
                sourceNamespace: openshift-marketplace
        
        - name: Verfiy tempo operator installation
          shell: oc get pods -n "{{ tempo_operator_namespace }}" --no-headers | grep -v "Running\|Completed" | wc -l
          register: tempo_pods
          until: tempo_pods.stdout|int == 0 and tempo_pods.stderr == ""
          retries: 10
          delay: 30
      when: tempo_csv.resources | selectattr('metadata.name', 'search', 'tempo') | list | length == 0

    - name: Install opentelemetry operator
      block:
        - name: Create a target namespace for opentelemetry operator
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: "{{ opentelemetry_operator_namespace }}"
                labels:
                  openshift.io/cluster-monitoring: "true"
        
        - name: Create a OperatorGroup for tempo and opentelemetry operator
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: operators.coreos.com/v1
              kind: OperatorGroup
              metadata:
                name: "{{ opentelemetry_operator_namespace }}"
                namespace: "{{ opentelemetry_operator_namespace }}"

        - name: Create a subscription for opentelemetry operator
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: operators.coreos.com/v1alpha1
              kind: Subscription
              metadata:
                name: "opentelemetry-product"
                namespace: "{{ opentelemetry_operator_namespace }}"
              spec:
                channel: "{{ coo_channel }}"
                installPlanApproval: Automatic
                name: "opentelemetry-product"
                source: "redhat-operators"
                sourceNamespace: openshift-marketplace

        - name: Verfiy opentelemetry operator installation
          shell: oc get pods -n "{{ opentelemetry_operator_namespace }}" --no-headers | grep -v "Running\|Completed" | wc -l
          register: opentelemetry_pods
          until: opentelemetry_pods.stdout|int == 0 and opentelemetry_pods.stderr == ""
          retries: 10
          delay: 30
      when: opentelemetry_csv.resources | selectattr('metadata.name', 'search', 'opentelemetry') | list | length == 0
  when: enable_distributed_tracing_uiplugin or enable_troubleshootingpanel_uiplugin

- name: Deploy Distributed Tracing Console UI plugin
  block:
    - name: Create the Tracing UIPlugin CR.
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: observability.openshift.io/v1alpha1
          kind: UIPlugin
          metadata:
            name: distributed-tracing
            namespace: "{{ coo_operator_namespace }}"
          spec:
            type: DistributedTracing

    - name: Verify Tracing UI plugin
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ coo_operator_namespace }}"
      register: tracing_pods_info
      until: tracing_pods_info.resources | selectattr('metadata.name', 'search', 'distributed-tracing-') | selectattr('status.phase', 'equalto', 'Running') | list | length == 1
      retries: 10
      delay: 30

    - name: Clone Distributed Tracing QE repo
      git:
        repo: "{{ distributed_tracing_qe_repo }}"
        dest: "{{ coo_work_dir_path }}/distributed-tracing-console-plugin"
        version: "{{ distributed_tracing_qe_repo_branch }}"
        force: true

    - name: Download and untar chainsaw
      unarchive:
        src: "{{ chainsaw_tarball }}"
        dest: "{{ chainsaw_path }}"
        remote_src: yes

    - name: Set chainsaw tests base path facts
      set_fact:
        chainsaw_tests_dir: "{{ coo_work_dir_path }}/distributed-tracing-console-plugin/tests/fixtures/chainsaw-tests"
        tls_profile_dir: "{{ coo_work_dir_path }}/distributed-tracing-console-plugin/tests/fixtures/chainsaw-tests/tls-profile"

    - name: Discover standalone chainsaw test directories
      find:
        paths: "{{ chainsaw_tests_dir }}"
        file_type: directory
        recurse: false
      register: chainsaw_test_dirs

    # ---------------------------------------------------------------
    # Pre-render tls-profile shared files
    #
    # tls-profile-setup references ../tls-profile/00-install-tls-scanner.yaml
    # and ../tls-profile/00-assert.yaml via apply/assert blocks. Chainsaw
    # cannot resolve ($COO_NAMESPACE) in externally referenced files from
    # step outputs, so we substitute the literal namespace up front.
    # ---------------------------------------------------------------
    - name: Pre-render ($COO_NAMESPACE) in tls-profile shared apply/assert files
      replace:
        path: "{{ item }}"
        regexp: '\(\$COO_NAMESPACE\)'
        replace: "{{ coo_operator_namespace }}"
      loop:
        - "{{ tls_profile_dir }}/00-install-tls-scanner.yaml"
        - "{{ tls_profile_dir }}/00-assert.yaml"

    - name: Pre-render bare $COO_NAMESPACE inside JMESPath join() in tls-profile shared files
      replace:
        path: "{{ item }}"
        regexp: '\$COO_NAMESPACE'
        replace: "'{{ coo_operator_namespace }}'"
      loop:
        - "{{ tls_profile_dir }}/00-install-tls-scanner.yaml"
        - "{{ tls_profile_dir }}/00-assert.yaml"

    # ---------------------------------------------------------------
    # Fix relative helper path in tls-profile-* chainsaw-test.yaml files
    #
    # All tls-profile-* tests source tls-helpers.sh with:
    #   . ../tls-profile/tls-helpers.sh
    # Chainsaw runs inline script content from a temp directory, so the
    # relative path fails. Replace with the absolute path.
    # ---------------------------------------------------------------
    - name: Rewrite relative tls-helpers.sh path to absolute in tls-profile-* chainsaw-test.yaml files
      replace:
        path: "{{ chainsaw_tests_dir }}/{{ item }}/chainsaw-test.yaml"
        regexp: '\. \.\./tls-profile/tls-helpers\.sh'
        replace: ". {{ tls_profile_dir }}/tls-helpers.sh"
      loop:
        - tls-profile-setup
        - tls-profile-intermediate
        - tls-profile-modern
        - tls-profile-custom-ciphers
        - tls-profile-old
        - tls-profile-revert

    # ---------------------------------------------------------------
    # Run standalone tests (all dirs except tls-profile* suite)
    # ---------------------------------------------------------------
    - name: Delete stale hotrod-curl Jobs from prior runs
      kubernetes.core.k8s:
        state: absent
        api_version: batch/v1
        kind: Job
        name: hotrod-curl
        namespace: "{{ item }}"
      loop:
        - chainsaw-mmo-rbac
        - chainsaw-rbac
      ignore_errors: true

    - name: Run standalone Distributed Tracing testcases
      shell: "{{ chainsaw_path }}/chainsaw test --skip-delete {{ item.path }}"
      register: tracing_tests
      loop: "{{ chainsaw_test_dirs.files | rejectattr('path', 'search', '/tls-profile') | sort(attribute='path') | list }}"
      loop_control:
        label: "{{ item.path | basename }}"
      async: 300
      poll: 30
      ignore_errors: true

    - name: Save standalone test outputs to individual files
      copy:
        content: |
          === Test: {{ item.item.path | basename }} ===
          --- STDOUT ---
          {{ item.stdout }}
          --- STDERR ---
          {{ item.stderr }}
          --- Return Code: {{ item.rc }} ---
        dest: "{{ coo_work_dir_path }}/tracing_tests_{{ item.item.path | basename }}.txt"
      loop: "{{ tracing_tests.results }}"
      loop_control:
        label: "{{ item.item.path | basename }}"

    - name: Report failed standalone chainsaw tests
      debug:
        msg: "FAILED standalone tests: {{ tracing_tests.results | selectattr('rc', 'ne', 0) | map(attribute='item.path') | map('basename') | list }}"
      when: tracing_tests.results | selectattr('rc', 'ne', 0) | list | length > 0

    # ---------------------------------------------------------------
    # Run tls-profile-* suite in strict sequential order
    #
    # These tests share cluster state (tls-scanner pod, scaled-down
    # operator) and must run in order:
    #   setup → intermediate → modern → custom-ciphers → old → revert
    # ---------------------------------------------------------------
    - name: Run tls-profile test suite in order
      shell: >
        {{ chainsaw_path }}/chainsaw test --skip-delete
        {{ chainsaw_tests_dir }}/tls-profile-setup
        {{ chainsaw_tests_dir }}/tls-profile-intermediate
        {{ chainsaw_tests_dir }}/tls-profile-modern
        {{ chainsaw_tests_dir }}/tls-profile-custom-ciphers
        {{ chainsaw_tests_dir }}/tls-profile-old
        {{ chainsaw_tests_dir }}/tls-profile-revert
      register: tls_profile_tests
      async: 1200
      poll: 30
      ignore_errors: true

    - name: Save tls-profile suite output to file
      copy:
        content: |
          === Test: tls-profile suite ===
          --- STDOUT ---
          {{ tls_profile_tests.stdout }}
          --- STDERR ---
          {{ tls_profile_tests.stderr }}
          --- Return Code: {{ tls_profile_tests.rc }} ---
        dest: "{{ coo_work_dir_path }}/tracing_tests_tls-profile-suite.txt"

    - name: Report tls-profile suite result
      debug:
        msg: "tls-profile suite FAILED (rc={{ tls_profile_tests.rc }})"
      when: tls_profile_tests.rc != 0
  when: enable_distributed_tracing_uiplugin 


- name: Deploy Troubleshooting Panel UI plugin
  block:
    - name: Create a Deployment to create Test Data
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion:  apps/v1
          kind: Deployment
          metadata:
            name: bad-deployment
            namespace: default
          spec:
            selector:
              matchLabels:
                app: bad-deployment
            template:
              metadata:
                labels:
                  app: bad-deployment
              spec:
                containers:
                - name: bad-deployment
                  image: quay.io/openshift-logging/vector:5.8

    - name: Create TroubleShooting-Panel UIPlugin CR.
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: observability.openshift.io/v1alpha1
          kind: UIPlugin
          metadata:
            name: troubleshooting-panel
          spec:
            troubleshootingPanel:
              timeout: 5m
            type: TroubleshootingPanel
 
    - name: Verify Korrel8r pod is in Running state
      k8s_info:
        kind: Pod
        namespace: "{{ coo_operator_namespace }}"
      register: korrel8r_pods
      until: >
        (
          korrel8r_pods.resources
          | selectattr('metadata.name', 'search', 'korrel8r')
          | selectattr('status.phase', 'equalto', 'Running')
          | list
          | length
        ) == 1
      retries: 10
      delay: 30

    - name: Verify troubleshooting-panel pod is in Running state
      k8s_info:
        kind: Pod
        namespace: "{{ coo_operator_namespace }}"
      register: troubleshooting_pods
      until: >
        (
          troubleshooting_pods.resources
          | selectattr('metadata.name', 'search', 'troubleshooting-panel')
          | selectattr('status.phase', 'equalto', 'Running')
          | list
          | length
        ) == 1
      retries: 10
      delay: 30
  when: enable_troubleshootingpanel_uiplugin

- name: Deploy Incidents plugin
  block:
    - name: Enable Monitoring plugin
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: observability.openshift.io/v1alpha1
          kind: UIPlugin
          metadata:
            name: monitoring
          spec:
            type: Monitoring
            monitoring:
              incidents:
                enabled: true

    - name: Verify Monitoring UIPlugin pod via label
      k8s_info:
        kind: Pod
        namespace: "{{ coo_operator_namespace }}"
      register: monitoring_pods_info
      until: >
        (
          monitoring_pods_info.resources
          | selectattr('metadata.name', 'search', 'health-analyzer')
          | selectattr('status.phase', 'equalto', 'Running')
          | list
          | length
        ) == 1
      retries: 10
      delay: 30

    - name: Check metrics are exposed
      shell: oc exec -n openshift-monitoring -it prometheus-k8s-0 -- curl -s "http://localhost:9090/api/v1/query?query=cluster:health:components"
      register: prometheus_metrics

    - name: Display prometheus metrics
      debug:
        msg: "{{ prometheus_metrics.stdout_lines }}"
  when: enable_monitoring_uiplugin

- name: Deploy Perses Config
  block:
    - name: Clone Perses Config
      ansible.builtin.git:
        repo: "https://github.com/perses/perses-operator.git"
        dest: "{{ coo_work_dir_path }}/perses-operator"
        force: true

    - name: Change the namespace in Perses config files
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: '^(\s*)namespace:.*'
        replace: '\1namespace: "{{ coo_operator_namespace }}"'
      loop:
        - "{{ coo_work_dir_path }}/perses-operator/config/samples/openshift/openshift-cluster-sample-dashboard.yaml"
        - "{{ coo_work_dir_path }}/perses-operator/config/samples/openshift/thanos-querier-datasource.yaml"

    - name: Create Perses Dashboard and Datasource
      k8s:
        state: present
        kubeconfig: "{{ coo_e2e_env.KUBECONFIG }}"
        src: "{{ item }}"
      loop:
        - "{{ coo_work_dir_path }}/perses-operator/config/samples/openshift/openshift-cluster-sample-dashboard.yaml"
        - "{{ coo_work_dir_path }}/perses-operator/config/samples/openshift/thanos-querier-datasource.yaml"
      register: perses_config
       
    - name: Fail if any failed
      ansible.builtin.fail:
        msg: "Some resources failed"
      when: |
        perses_config.results
        | selectattr('failed', 'defined')
        | selectattr('failed')
        | list
        | length > 0    

    - name: Verify Monitoring UIPlugin exists
      k8s_info:
        kind: UIPlugin
        name: monitoring
        api_version: observability.openshift.io/v1alpha1
      register: monitoring_uiplugin

    - name: Patch the Monitoring UIPlugin to enable Perses
      kubernetes.core.k8s:
        state: present
        api_version: observability.openshift.io/v1alpha1
        kind: UIPlugin
        name: monitoring
        merge_type: merge
        definition:
          spec:
            monitoring:
              perses:
                enabled: true
      when: monitoring_uiplugin.resources | selectattr('metadata.name', 'search', 'monitoring') | length > 0
    
    - name: Enable Perses
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: observability.openshift.io/v1alpha1
          kind: UIPlugin
          metadata:
            name: monitoring
          spec:
            type: Monitoring
            monitoring:
              incidents:
                enabled: true
              perses:
                enabled: true
      when: monitoring_uiplugin.resources | selectattr('metadata.name', 'search', 'monitoring') | length == 0
  when: enable_perses_dashboard

- name: Create archive on target machine
  ansible.builtin.archive:
    path: "{{ coo_work_dir_path }}"
    dest: /tmp/coo_testoutput.tar.gz
    format: gz

- name: Fetch archive to Ansible controller
  ansible.builtin.fetch:
    src: /tmp/coo_testoutput.tar.gz
    dest: "{{ playbook_dir }}/../../deploy/"
    flat: true
