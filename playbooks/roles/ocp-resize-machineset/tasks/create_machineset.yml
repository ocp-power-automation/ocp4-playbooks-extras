---
- name: Get existing worker MachineSet
  shell: |
    oc get machinesets -n {{ namespace }} --no-headers | \
    grep worker | grep -v worker2 | awk '{print $1}'
  register: worker_machineset
  changed_when: false

- name: Set worker2 MachineSet name
  set_fact:
    worker2_name: "{{ worker_machineset.stdout }}2"

- name: Use worker2 MachineSet
  set_fact:
    machineset_name: "{{ worker2_name }}"

- name: Check if worker2 MachineSet exists
  shell: |
    oc get machineset {{ worker2_name }} \
    -n {{ namespace }} --ignore-not-found
  register: worker2_check
  changed_when: false

- name: Export worker MachineSet
  shell: |
    oc get machineset {{ worker_machineset.stdout }} \
    -n {{ namespace }} -o yaml > /tmp/worker2.yaml
  when: worker2_check.stdout == ""

- name: Rename worker MachineSet to worker2
  replace:
    path: /tmp/worker2.yaml
    regexp: "{{ worker_machineset.stdout }}"
    replace: "{{ worker2_name }}"
  when: worker2_check.stdout == ""

- name: Set replicas to zero
  replace:
    path: /tmp/worker2.yaml
    regexp: 'replicas: [0-9]+'
    replace: 'replicas: 0'
  when: worker2_check.stdout == ""

- name: Remove autogenerated fields
  shell: |
    sed -i '/resourceVersion:/d' /tmp/worker2.yaml
    sed -i '/uid:/d' /tmp/worker2.yaml
    sed -i '/creationTimestamp:/d' /tmp/worker2.yaml
    sed -i '/generation:/d' /tmp/worker2.yaml
  when: worker2_check.stdout == ""

- name: Remove status section
  shell: |
    sed -i '/^status:/,$d' /tmp/worker2.yaml
  when: worker2_check.stdout == ""

- name: Create worker2 MachineSet
  command:
    oc apply -f /tmp/worker2.yaml
  when: worker2_check.stdout == ""

- name: Display MachineSet in use
  debug:
    msg: "Using MachineSet {{ machineset_name }}"
